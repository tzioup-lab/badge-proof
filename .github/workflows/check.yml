name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python bootstrap.py --check --offline
      - run: python bootstrap_check.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence-chromium
          path: test-results/
  other-browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser
        env:
          BADGE_PROOF_ENGINE: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.engine }}
          path: test-results/
