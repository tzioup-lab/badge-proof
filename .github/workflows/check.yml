name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python bootstrap.py --check --offline
      - run: python bootstrap_check.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
